name: TC CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/CI-TC.yaml'
      - 'tests/tc/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/CI-TC.yaml'
      - 'tests/tc/**'
  workflow_dispatch:

jobs:
  test-tc:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping iperf3 tcpdump tshark ncat
          pip install pytest scipy

      - name: Run TC tests
        run: |
          sudo "$(command -v python)" -m pytest tests/tc/ -v
