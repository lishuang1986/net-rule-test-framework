name: Core Framework CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'framework/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'framework/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip iproute2 iputils-ping iptables nftables cgroup-tools
          pip install pytest scipy

      - name: Run tests with netns infra
        run: |
          pytest tests/ -v --infra netns \
            --ignore=tests/rocev2 \
            --ignore=tests/firewall/nftables/test_match_meta_cgroupv2.py
