name: Firewall CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/CI-FW.yaml'
      - 'tests/firewall/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/CI-FW.yaml'
      - 'tests/firewall/**'
  workflow_dispatch:

jobs:
  test-firewall:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping iptables nftables
          pip install pytest

      - name: Load legacy xtables kernel modules
        run: sudo modprobe ip_tables ip6_tables iptable_filter ip6table_filter

      - name: Run firewall tests
        run: |
          sudo "$(command -v python)" -m pytest tests/firewall/ -v \
            --ignore=tests/firewall/nftables/test_match_meta_cgroupv2.py
