name: Firewall CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'tests/firewall/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'tests/firewall/**'
  workflow_dispatch:

jobs:
  test-firewall:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip iproute2 iputils-ping iptables nftables
          pip install pytest

      - name: Run firewall tests
        run: |
          pytest tests/firewall/ -v \
            --ignore=tests/firewall/nftables/test_match_meta_cgroupv2.py
