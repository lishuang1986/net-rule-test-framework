name: AI-driven CI

on:
  pull_request:
  workflow_dispatch:      # Run the full suite by default on manual trigger

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────
  # Use DeepSeek to select tests based on the diff.
  #
  # Runs with the same dependencies as `test`, so that
  # `pytest --collect-only` sees the exact same import environment as
  # execution. Without this, pick silently missed tests whose modules
  # failed to import on the bare host runner.
  # ─────────────────────────────────────────────────────
  pick:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.sel.outputs.tests }}
      reason: ${{ steps.sel.outputs.reason }}
      count: ${{ steps.sel.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history required for git diff origin/main

      - name: Fetch base branch
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE:refs/remotes/origin/$BASE"
          git rev-parse "origin/$BASE"

      # Pin to 3.10.16, NOT 3.10 (latest).
      # 3.10.22 is built against OpenSSL 3.3, which Ubuntu 24.04 does not ship.
      # The runner ships OpenSSL 3.0.x, so we need a Python built against 3.0.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'

      - name: Verify Python SSL
        run: python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"

      # Same dependency install as `test`, so collect() sees the same
      # environment as execution. This is what fixes the "pick missed
      # test_qdisc_netem.py" bug.
      - name: Install dependencies
        run: bash scripts/setup.sh

      - id: sel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/select_tests.py

  # ─────────────────────────────────────────────────────
  # Run the AI-selected tests in the same environment as CI-core
  # ─────────────────────────────────────────────────────
  test:
    needs: pick
    if: needs.pick.result == 'success' && needs.pick.outputs.tests != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pin to 3.10.16, NOT 3.10 (latest).
      # 3.10.22 is built against OpenSSL 3.3, which Ubuntu 24.04 does not ship.
      # The runner ships OpenSSL 3.0.x, so we need a Python built against 3.0.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'

      - name: Verify Python SSL
        run: python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"

      - name: Install dependencies
        run: bash scripts/setup.sh

      - name: Load legacy xtables kernel modules
        run: sudo modprobe ip_tables ip6_tables iptable_filter ip6table_filter

      - name: Run selected tests
        shell: bash
        env:
          TESTS_JSON: ${{ needs.pick.outputs.tests }}
        run: |
          mapfile -t TESTS < <(
            echo "$TESTS_JSON" | python -c \
              'import json,sys; [print(t) for t in json.load(sys.stdin)]'
          )
          echo "Running ${#TESTS[@]} test(s):"
          printf '  %s\n' "${TESTS[@]}"
          sudo "$(command -v python)" -m pytest -v --infra netns "${TESTS[@]}"

  # ─────────────────────────────────────────────────────
  # Post the AI selection result as a PR comment
  # ─────────────────────────────────────────────────────
  comment:
    needs: pick
    if: github.event_name == 'pull_request' && needs.pick.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TESTS: ${{ needs.pick.outputs.tests }}
          REASON: ${{ needs.pick.outputs.reason }}
          COUNT: ${{ needs.pick.outputs.count }}
        with:
          script: |
            const tests  = JSON.parse(process.env.TESTS || '[]');
            const reason = process.env.REASON || '';
            const count  = process.env.COUNT  || '0';
            const list = tests.length
              ? tests.map(t => `- \`${t}\``).join('\n')
              : '_no tests selected_';
            const body = [
              `🤖 **AI selected ${count} test(s)**`,
              ``,
              `**Reason**: ${reason}`,
              ``,
              `<details><summary>Show test list</summary>`,
              ``,
              list,
              ``,
              `</details>`,
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
