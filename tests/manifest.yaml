# tests/manifest.yaml
# Test file descriptions come from module/function docstrings, extracted
# at runtime with `ast`. Files without docstrings fall back to the bare
# path in the LLM prompt -- so write docstrings.

exclude:
  - tests/rocev2/
  - tests/firewall/nftables/test_match_meta_cgroupv2.py

critical_paths:
  - "framework/"
  - "conftest.py"
  - "pytest.ini"
  - "pyproject.toml"
  - "requirements.txt"
  - "Makefile"
  - "scripts/"
  - ".github/workflows/"
  - "tests/manifest.yaml"
