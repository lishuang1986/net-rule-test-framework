# tests/manifest.yaml
# Domains are defined by path; the actual test list is collected at runtime
# via `pytest --collect-only`. Add new tests freely -- no need to update this file.

domains:
  firewall:
    description: "iptables/nftables firewall rule tests (drop, meta cgroupv2 match)"
    paths:
      - tests/firewall/**

  tc:
    description: "Linux Traffic Control: qdisc (netem/ets) and filter (u32) tests"
    paths:
      - tests/tc/**

# Tests that cannot run in GitHub CI. Both file paths and full node IDs work.
# A file path excludes all tests in that file.
exclude:
  - tests/firewall/nftables/test_match_meta_cgroupv2.py
  - tests/tc/test_qdisc_red.py

# Touching any of these forces a full run (LLM not consulted)
critical_paths:
  - "framework/"
  - "conftest.py"
  - "pytest.ini"
  - "pyproject.toml"
  - "requirements.txt"
  - "Makefile"
  - "scripts/"
  - ".github/workflows/"
  - "tests/manifest.yaml"
