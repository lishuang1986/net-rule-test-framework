# tests/manifest.yaml
# File descriptions are read from module/function docstrings automatically.
# The `files:` block below is an OPTIONAL fallback for files that have
# no docstrings; it is NOT required and should be kept minimal.
files: {}

exclude:
  - tests/rocev2/
  - tests/firewall/nftables/test_match_meta_cgroupv2.py

critical_paths:
  - "framework/"
  - "conftest.py"
  - "pytest.ini"
  - "pyproject.toml"
  - "requirements.txt"
  - "Makefile"
  - "scripts/"
  - ".github/workflows/"
  - "tests/manifest.yaml"
